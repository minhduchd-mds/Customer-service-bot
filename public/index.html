<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Bot Hub</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/inbox.css" />
  <link rel="stylesheet" href="/operations.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-nav="home" aria-label="Bot Hub home"><span class="brand-mark">⌁</span><span>Bot Hub</span></button>
      <nav class="nav-group" aria-label="Primary">
        <button class="nav-item active" data-nav="home"><span>⌂</span><span>Home</span></button>
        <button class="nav-item" data-nav="bots"><span>◉</span><span>Bots</span></button>
        <button class="nav-item" data-nav="conversations"><span>▣</span><span>Conversations</span></button>
        <button class="nav-item" data-nav="customers"><span>◎</span><span>Customers</span></button>
      </nav>
      <div class="nav-rule"></div>
      <nav class="nav-group" aria-label="Operations">
        <button class="nav-item" data-nav="automations"><span>⌁</span><span>Automations</span></button>
        <button class="nav-item" data-nav="analytics"><span>▤</span><span>Analytics</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <button class="nav-item" data-nav="settings"><span>⚙</span><span>Settings</span></button>
      <div class="profile-mini"><span class="avatar">D</span><div><strong>Workspace</strong><small>Default</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow" id="page-eyebrow">Workspace</p><h1 id="page-title">Good evening.</h1></div>
        <div class="top-actions"><span class="health" id="health"><i></i> Checking</span><button class="primary-button" id="new-bot">＋ New Bot</button></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <script src="/runtime.js"></script>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/inbox.js"></script>
  <script type="module" src="/operations.js"></script>
</body>
</html>

name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Validate deployment configuration
        env:
          BOT_DOMAIN: bot.example.test
          N8N_DOMAIN: n8n.example.test
          POSTGRES_PASSWORD: ci-postgres-password
          N8N_ENCRYPTION_KEY: ci-n8n-encryption-key
          CREDENTIAL_VAULT_MASTER_KEY: ci-vault-master-key
          WEB_WIDGET_SIGNING_KEY: ci-widget-signing-key
        run: |
          sh -n scripts/vps-bootstrap.sh
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8'));"
          cp .env.example .env
          docker compose config >/dev/null
          docker compose -f docker-compose.desktop.yml config >/dev/null
          rm -f .env

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: customer-service-bot:ci
